[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "vite"

# Prerendered routes are served as real files (dist/<route>/index.html).
# Anything else falls back to the noindex SPA shell instead of the homepage.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
