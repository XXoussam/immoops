[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Not secrets: the agent's public name (also the default in token.js) and the token URL built
# into the frontend. Every other env var stays covered by Netlify's secrets scanning.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "LIVEKIT_AGENT_NAME,VITE_LIVEKIT_TOKEN_URL"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "vite"

# Prerendered routes are served as real files (dist/<route>/index.html).
# Anything else gets dist/404.html (prerendered "Page introuvable", noindex) with a real 404 status:
# Netlify does that by itself when no file matches, so no catch-all redirect.
